<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
{{ font_css | safe }}
* {box-sizing:border-box; margin:0; padding:0}
body {width:1080px; height:1920px; overflow:hidden; background:{{ primary }}; color:{{ text }}; font-family:'ShortsFont','Segoe UI',Arial,sans-serif}
body::after {content:''; position:absolute; width:550px; height:550px; right:-220px; bottom:70px; border:60px solid {{ accent }}; border-radius:50%; opacity:.25}
.brand {position:absolute; top:85px; left:80px; font-size:32px; letter-spacing:5px; color:{{ accent }};display:flex;align-items:center;gap:20px}
.brand img {width:70px;height:70px;border-radius:18px}
.stage {position:absolute;top:195px;left:80px;font-size:25px;letter-spacing:5px;color:{{ accent }}}
main {position:absolute; top:250px; left:80px; width:820px; height:1050px; display:flex; flex-direction:column; justify-content:center; gap:40px; overflow-wrap:anywhere}
.panel {padding:48px; background:{{ secondary }}; border-radius:32px; border:3px solid {{ accent }}; display:flex; flex-direction:column; gap:35px}
h1 {font-size:80px; line-height:1.15; font-weight:800}
h2 {font-size:64px; line-height:1.25}
p,.value {font-size:56px; line-height:1.3}
.label {font-size:56px; font-weight:700; margin-bottom:12px; color:{{ text }}}
.badge {font-size:56px; padding:22px 28px; background:{{ text }}; color:{{ primary }}; border-radius:18px; align-self:flex-start}
.domain {font-size:56px; color:{{ text }}; border-top:3px solid {{ accent }}; padding-top:35px}
.eyebrow {font-size:26px;letter-spacing:2px;color:{{ accent }};font-weight:700}
.excerpt {font-size:48px;line-height:1.3}
.source-meta {font-size:29px;line-height:1.5;opacity:.85;overflow-wrap:anywhere}
.evidence-panel {gap:24px;padding:38px}
.explainer {padding:30px 0;border-top:3px solid {{ accent }};display:flex;flex-direction:column;gap:18px}
.explainer p {font-size:44px;line-height:1.3}
.cover-pay {font-size:92px;font-weight:900;line-height:1.12;color:{{ accent }};overflow-wrap:anywhere}
.cover-role {font-size:78px;line-height:1.12}
.cover-company {font-size:46px;line-height:1.25;opacity:.92}
.cover-location,.cover-note {font-size:34px;line-height:1.3;padding:18px 24px;border:2px solid {{ accent }};border-radius:16px;align-self:flex-start}
.variant-1 main {text-align:center}
.variant-1 .panel {border-radius:100px}
.variant-1 .badge {align-self:center}
.variant-2 .panel {border-radius:0; border-left:18px solid {{ accent }}; border-top:0; border-right:0; border-bottom:0}
.variant-2 h1 {font-size:76px}
</style></head><body class="variant-{{ layout_variant }}">
<div class="brand">{% if brand_logo %}<img src="{{ brand_logo }}" alt="">{% endif %}UNEMPLOYER</div>
<div class="stage">{{ scene_label }}</div>
{% if promoted %}<div style="position:absolute;top:160px;left:80px;font-size:56px;font-weight:700">Promoted</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
</body></html>
