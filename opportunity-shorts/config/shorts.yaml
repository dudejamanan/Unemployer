# Shorts generation settings
# Env vars override these where noted

# LLM settings for script generation
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:8b
  temperature: 0.6
  max_retries: 2
  timeout_seconds: 300
  fallback_on_failure: false
  num_ctx: 4096
  keep_alive: 0  # Unload model RAM immediately after each script request.
  num_gpu: 0  # CPU mode avoids the observed local CUDA/PTX failure.

automation:
  enabled: true
  max_builds_per_run: 3
  interval_minutes: 30
  collection_interval_minutes: 15
  publishing_mode: immediate
  min_upload_interval_minutes: 144  # Space automatic Shorts across the day.
  priority:
    skip_unpaid: true
    urgent_deadline_days: 3

# Voice settings (edge-tts)
linkedin:
  enabled: true  # Buffer company-page publishing verified live.
  provider: buffer
  buffer_organization_id: "6acd43f6eef1fab19d6da040"
  buffer_channel_id: "6acd4477778b240e2fec5985"
  author: ""  # urn:li:organization:<numeric-page-id>
  version: "202609"
  daily_limit: 50  # Buffer reports 50; 144-minute spacing still yields about 10/day.
  min_post_interval_minutes: 144
  max_posts_per_cycle: 1

# Voice settings (edge-tts)
# Run: edge-tts --list-voices | grep "en-IN" to see available Indian-English voices
voices:
  male: en-IN-PrabhatNeural  # Indian-English male voice
  female: en-IN-NeerjaNeural  # Indian-English female voice
  alternate: false  # Consistent narrator for the enriched opportunity series.

# Script constraints
script:
  min_words: 55
  max_words: 70
  target_duration_seconds: 25  # Target 20-35s, aim for middle
  max_title_chars: 100
  hinglish_enabled: true  # Allow light Hinglish in Latin script

# Visual theme settings
theme:
  safe_zone_bottom_percent: 22  # Leave bottom 22% free for YouTube UI
  safe_zone_right_percent: 12   # Leave right 12% free
  min_font_size: 56
  max_words_per_line: 7
  color_schemes:
    - name: navy
      primary: "#101b28"
      secondary: "#172635"
      accent: "#6ef2b5"
      text: "#ffffff"
      background: "#f7fafc"
    - name: forest
      primary: "#132a27"
      secondary: "#1b3934"
      accent: "#6ef2b5"
      text: "#ffffff"
      background: "#faf5ff"

assembly:
  subtle_motion: true
captions:
  highlight_words: true

business:
  contact_email: mananndudeja@gmail.com
  hub_url: "https://unemployer.syrupytide17.chatgpt.site"

# Upload and scheduling
upload:
  set_thumbnail: true  # Best-effort; YouTube decides Shorts/channel eligibility.
  privacy: public
  contains_synthetic_media: true
  api_daily_upload_limit: 100
  daily_limit: 100  # Publish immediately, subject to project/channel quota.
  ist_slots:
    - "08:00"
    - "13:00"
    - "19:00"
  category_id: 27  # Education category
  expected_channel_handle: unemployerr
  expected_channel_id: UCh9aBTHwc9QyIhe5SflYtBQ
  made_for_kids: false

# Paths (relative to project root or absolute)
paths:
  output_dir: "out"
  assets_dir: "assets"
  fonts_dir: "assets/fonts"
  music_dir: "assets/music"
